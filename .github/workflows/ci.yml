name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Install at the repo root so npm workspaces link `@thestats/core`
      # into `packages/web` (there is no package.json under `packages/`).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The integration + E2E suites run against a throwaway Supabase
      # built from THIS branch's supabase/migrations and config.toml, so
      # the schema always matches the code under test. (Running against
      # the shared hosted project broke every branch whose code didn't
      # match whatever migrations had last been pushed there, and sent
      # real sign-up emails through the hosted mailer.) Only the services
      # the app uses are started: Postgres, Auth, PostgREST, the API
      # gateway, and the local mail catcher for confirmation emails.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Start local Supabase
        working-directory: packages/web
        run: |
          supabase start -x studio,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,postgres-meta,supavisor
          # Map the local stack's URL + keys onto the names the app and
          # tests read. These are the CLI's fixed local-dev keys, not secrets.
          eval "$(supabase status -o env)"
          for v in API_URL ANON_KEY SERVICE_ROLE_KEY; do
            [ -n "${!v:-}" ] || { echo "::error::supabase status did not report $v"; exit 1; }
          done
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Runs every workspace's tests with coverage (core, app, web, mobile),
      # including the web integration suites under tests/integration.
      - name: Unit + integration tests
        run: npm run test:coverage

      - name: Install Playwright browsers
        working-directory: packages/web
        run: npx playwright install --with-deps

      - name: E2E tests
        working-directory: packages/web
        run: npm run test:e2e

      - name: Supabase logs on failure
        if: failure()
        working-directory: packages/web
        run: |
          for c in $(docker ps --format '{{.Names}}' | grep -E '^supabase_(auth|db|rest|kong)_'); do
            echo "::group::$c"
            docker logs --tail 200 "$c" 2>&1
            echo "::endgroup::"
          done

  perf-budget:
    runs-on: ubuntu-latest
    needs: test
    # Build + Lighthouse only render public pages; the middleware still
    # validates the Supabase env and calls Auth, which needs no schema,
    # so the hosted project's credentials are fine here. Forked-PR runs
    # don't receive secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle size budget
        working-directory: packages/web
        run: npm run size

      - name: Lighthouse CI (perf + a11y budgets)
        working-directory: packages/web
        run: npm run lhci

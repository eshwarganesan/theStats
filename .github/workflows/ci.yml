name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supabase credentials for the integration + E2E suites. On same-repo
# branches these come from repository secrets; on forked-PR runs GitHub
# withholds secrets, so the vars are empty and the auth/account specs
# self-skip (they guard on these being set).
env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install at the repo root so npm workspaces link `@thestats/core`
      # into `packages/web` (there is no package.json under `packages/`).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs vitest coverage across every workspace (web + core), including
      # the web integration suites under tests/integration.
      - name: Unit + integration tests
        run: npm run test:coverage

      - name: Install Playwright browsers
        working-directory: packages/web
        run: npx playwright install --with-deps

      - name: E2E tests
        working-directory: packages/web
        run: npm run test:e2e

  perf-budget:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle size budget
        working-directory: packages/web
        run: npm run size

      - name: Lighthouse CI (perf + a11y budgets)
        working-directory: packages/web
        run: npm run lhci
